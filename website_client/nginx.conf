server {
    listen 80;
    server_name localhost;

    # 允許上傳最大 50MB 圖片
    client_max_body_size 50M;

    # ==============================================================
    # Nginx 邊緣防爬蟲與惡意探測防禦規則
    # ==============================================================

    # 1. 阻擋常見惡意爬蟲、漏洞掃描器與未授權自動化腳本 User-Agent
    if ($http_user_agent ~* (Scrapy|python-requests|aiohttp|wget|curl\/|libwww-perl|sqlmap|nikto|HTTrack|Apache-HttpClient|Go-http-client|postmanruntime|masscan|censys|zgrab)) {
        return 403 "Forbidden: Automated crawling is prohibited.";
    }

    # 2. 阻擋完全空白的 User-Agent 請求
    if ($http_user_agent = "") {
        return 403 "Forbidden: Invalid client identifier.";
    }

    # 3. 嚴格阻擋隱藏系統檔探測 (.env, .git 等)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 4. 阻擋常見動態後門探針腳本 (*.php, *.asp, *.jsp 等)
    location ~* \.(php|jsp|asp|aspx|sh|bash|sql)$ {
        return 404;
    }

    # ==============================================================
    # 前端 React 靜態檔案與 SPA 路由重導向
    # ==============================================================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ==============================================================
    # 反向代理後端 API 請求至 FYPServer 容器
    # ==============================================================
    location ~ ^/(users|foods|shops|market|comment|feedback|bulletin|upload|sync|analytics|system|images)/? {
        proxy_pass http://fypserver:7788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Gzip 壓縮設定
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
}
